<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · Page not found</title>
    
    <link rel="stylesheet" href="/css/vendor.css">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/resources.css">
    <link rel="stylesheet" href="/css/404.css">
</head>
<body>
    <main class="site-main">
        <div class="container">
            <div class="error-icon" aria-hidden="true">
                <svg width="110" height="80" viewBox="0 0 110 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M30 55 C18 55 12 47 15 37 C10 28 15 18 26 18 C27 10 38 6 48 10 C56 4 70 6 74 16 C84 16 92 24 88 34 C94 39 92 50 84 54 C79 56 74 56 68 55 L30 55Z" stroke="#ffcc00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="rgba(255,204,0,0.05)"/>
                    <path d="M48 42 L62 42" stroke="#ffcc00" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="40" cy="46" r="2.5" fill="#ffcc00" fill-opacity="0.8"/>
                    <circle cx="68" cy="46" r="2.5" fill="#ffcc00" fill-opacity="0.8"/>
                </svg>
            </div>

            <h1 class="error-code">404</h1>
            <h2 class="error-title">Page not found</h2>
            
            <p class="error-message">
                The page you are looking for might have been removed, had its name changed,<br>
                or is temporarily unavailable.
            </p>

            <div class="action-buttons">
                <a href="/" class="btn btn-primary">← Back to homepage</a>
                <button type="button" onclick="window.location.reload();" class="btn btn-secondary">⟳ Try again</button>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="row footer-bottom">
            <div class="col-twelve">
                <div class="copyright">
                    <span>© Copyright sohaib.eu 2020 - <span id="current-year"></span></span>
                    <span>Contact: <a href="#">info[at]cybersec.sohaib[dot]eu</a></span>
                    <span>With <i class="fa fa-code"></i> and <i class="fa fa-coffee"></i> - <a href="https://www.sohaib.eu">sohaib.eu</a> - <i class="fa fa-globe"></i> Barcelona</span>
                </div>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
